name: Build & Publish to NuGet

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore QuickStack/QuickStack.sln

    - name: Build
      run: dotnet build QuickStack/QuickStack.sln -c Release --no-restore

    - name: Pack NuGet package
      run: dotnet pack QuickStack.csproj -c Release --no-build -o artifacts
      working-directory: QuickStack

    - name: Upload package artifact
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: QuickStack/artifacts/*.nupkg

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Derive version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

    - name: Pack NuGet package
      run: dotnet pack QuickStack.csproj -c Release -o artifacts -p:Version=$VERSION
      working-directory: QuickStack

    - name: Push to NuGet.org
      run: dotnet nuget push artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
      working-directory: QuickStack

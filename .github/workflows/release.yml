name: Build Standalone Exe & Publish Release

on:
  push:
    tags: [ "v*" ]

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Derive version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

    - name: Publish self-contained single-file exe (Windows x64)
      run: dotnet publish QuickStack/QuickStack.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:PackAsTool=false -p:Version=$VERSION -o artifacts/win-x64

    - name: Publish self-contained single-file exe (Linux x64)
      run: dotnet publish QuickStack/QuickStack.csproj -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -p:PackAsTool=false -p:Version=$VERSION -o artifacts/linux-x64

    - name: Publish self-contained single-file exe (macOS x64)
      run: dotnet publish QuickStack/QuickStack.csproj -c Release -r osx-x64 --self-contained -p:PublishSingleFile=true -p:PackAsTool=false -p:Version=$VERSION -o artifacts/osx-x64

    - name: Rename artifacts
      run: |
        mv artifacts/win-x64/QuickStack.exe artifacts/quickstack-win-x64.exe
        mv artifacts/linux-x64/QuickStack artifacts/quickstack-linux-x64
        mv artifacts/osx-x64/QuickStack artifacts/quickstack-osx-x64

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: QuickStack v${{ env.VERSION }}
        tag_name: ${{ github.ref_name }}
        body: |
          ## QuickStack v${{ env.VERSION }}

          Standalone executables — **no .NET installation required** (self-contained).

          - **Windows**: `quickstack-win-x64.exe` — download, open a terminal, run `./quickstack-win-x64.exe`
          - **Linux**: `quickstack-linux-x64`
          - **macOS**: `quickstack-osx-x64`

          Or install via NuGet: `dotnet tool install --global QuickStack.cli --version ${{ env.VERSION }}`
        files: |
          artifacts/quickstack-win-x64.exe
          artifacts/quickstack-linux-x64
          artifacts/quickstack-osx-x64
